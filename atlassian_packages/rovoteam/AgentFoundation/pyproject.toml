[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-foundation"
version = "0.1.0"
description = "Agent Foundation library"
requires-python = ">=3.10"
dependencies = [
    "python-utils",
    "attrs",
    "pydantic",
    "requests",
    "rich",
    "textual",
    "typing-extensions",
    "tqdm",
    "PyYAML",
    "boto3",
    "botocore",
    "dash",
    "dash-bootstrap-components",
    "dash-cytoscape",
    "plotly",
    "anthropic",
    "httpx",
    "jinja2",
]

[tool.uv.sources]
python-utils = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agent_foundation"]

[tool.pytest.ini_options]
testpaths = ["test"]
