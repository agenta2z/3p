[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openteam"
version = "0.1.0"
description = "OpenTeam multi-agent workflow runtime + MCP server."
requires-python = ">=3.11"
dependencies = [
    "python-utils",
    "agent-foundation",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "jinja2",
    "PyYAML",
    "starlette",
    "typing-extensions",
    "fastmcp>=3.2,<4",
    "mcp>=1.25.0",
    "typer>=0.12",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "attrs>=23",
    "python-dotenv>=1",
]

[project.scripts]
openteam-mcp                = "openteam.mcp_server.cli:app"
openteam-task               = "openteam.server.resources.tools.task.cli:main"
openteam-create-role        = "openteam.server.resources.tools.create_role.cli:main"
openteam-role-setup         = "openteam.server.resources.tools.role_setup.cli:main"
openteam-project-onboarding = "openteam.server.resources.tools.project_onboarding.cli:main"
openteam-server             = "openteam.server.run_server:main"

[tool.uv.sources]
python-utils = { workspace = true }
agent-foundation = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/openteam"]

[tool.pytest.ini_options]
testpaths = ["test"]
