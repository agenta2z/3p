# MultiFlowDual — Round 7: MultiFlow propose + Dual review/fix loop with self-review-avoidance + winner-as-fixer dispatch.
# Default: 2 ClaudeCodeCli flows; review_inferencer is also ClaudeCodeCli (fixer_match_winner picks the winning flow).
# base_inferencer is auto-constructed by MultiFlowDual from flow_configs — DO NOT declare it here.
#
# This topology preset opts OUT of `inject_upstream_artifacts` (which is MFDual's
# class default True) because the per-flow followup_inferencer here is a bare
# ClaudeCodeCLI without `template_root_space` — it cannot consume a
# {{ upstream_artifacts }} slot. Opting out preserves the simple legacy
# behavior: each followup step receives the previous step's raw output as
# `inference_input`. Use the breakdown_multiflow_plan_then_implement.yaml
# configuration for the full peer-aware aggregation flow.
_target_: MultiFlowDual
inject_upstream_artifacts: false
flow_configs:
  - input: "{request}"
    initial_inferencer:
      _target_: ClaudeCodeCLI
      model_name: opus[1m]
      permission_mode: bypassPermissions
      idle_timeout_seconds: 300
    followup_inferencer:
      _target_: ClaudeCodeCLI
      model_name: opus[1m]
      permission_mode: bypassPermissions
      idle_timeout_seconds: 300
    max_dynamic_steps: 1
  - input: "{request}"
    initial_inferencer:
      _target_: ClaudeCodeCLI
      model_name: opus[1m]
      permission_mode: bypassPermissions
      idle_timeout_seconds: 300
    followup_inferencer:
      _target_: ClaudeCodeCLI
      model_name: opus[1m]
      permission_mode: bypassPermissions
      idle_timeout_seconds: 300
    max_dynamic_steps: 1
review_inferencer:
  _target_: ClaudeCodeCLI
  model_name: opus[1m]
  permission_mode: bypassPermissions
  idle_timeout_seconds: 300
multi_flow_aggregator_inferencer:
  # template_variables aggregation triplet provided by MFDual.SLOT_DEFAULTS
  # (this slot is forwarded to the auto-constructed inner MultiFlow's
  # aggregator_inferencer slot per multi_flow_dual_inferencer.py).
  _target_: ClaudeCodeCLI
  model_name: opus[1m]
  permission_mode: bypassPermissions
  idle_timeout_seconds: 300
  template_root_space: implementation
consensus_config:
  _target_: ConsensusConfig
  max_iterations: 2
visible_flows: all
fixer_match_winner: true
reviewer_match_second: true
