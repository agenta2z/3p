# BTA with Dual consensus per slot — role_setup-style: every breakdown/worker/aggregator runs proposer+reviewer consensus.
# All template wiring (template_root_space, template_variables aggregation triplet,
# template_key=review on reviewers) is provided by SLOT_DEFAULTS on the
# orchestrator classes (BTA breakdown/aggregator, Dual review). The aggregator
# Dual is template-transparent: BTA's aggregation triplet descends into base
# + review + fixer; Dual's review_inferencer template_key=review applies on top.
_target_: BTA
breakdown_inferencer:
  _target_: Dual
  base_inferencer:
    _target_: ClaudeCodeCLI
    model_name: opus[1m]
    permission_mode: bypassPermissions
    idle_timeout_seconds: 300
  review_inferencer:
    _target_: ClaudeCodeCLI
    model_name: opus[1m]
    permission_mode: bypassPermissions
    idle_timeout_seconds: 300
  consensus_config:
    _target_: ConsensusConfig
    max_iterations: 2
worker_factory:
  __default__:
    _target_: Dual
    base_inferencer:
      _target_: ClaudeCodeCLI
      model_name: opus[1m]
      permission_mode: bypassPermissions
      idle_timeout_seconds: 300
    review_inferencer:
      _target_: ClaudeCodeCLI
      model_name: opus[1m]
      permission_mode: bypassPermissions
      idle_timeout_seconds: 300
    consensus_config:
      _target_: ConsensusConfig
      max_iterations: 2
aggregator_inferencer:
  _target_: Dual
  base_inferencer:
    _target_: ClaudeCodeCLI
    model_name: opus[1m]
    permission_mode: bypassPermissions
    idle_timeout_seconds: 300
    template_root_space: implementation
  review_inferencer:
    _target_: ClaudeCodeCLI
    model_name: opus[1m]
    permission_mode: bypassPermissions
    idle_timeout_seconds: 300
    template_root_space: implementation
  consensus_config:
    _target_: ConsensusConfig
    max_iterations: 2
breakdown_format: json_subtasks
max_breakdown: 4
