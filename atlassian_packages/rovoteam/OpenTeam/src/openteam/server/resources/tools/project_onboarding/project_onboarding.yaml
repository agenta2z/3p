# Outer BTA for project_onboarding: breakdown project_document → N inner BTAs → synthesis
#
# Usage:
#   import agent_foundation.common.configs.registered_targets
#   from python_utils.config_utils import load_config, instantiate
#   cfg = load_config("project_onboarding.yaml", overrides={"workspace.root": str(ws)})
#   bta = instantiate(cfg)
#   result = await bta.ainfer(project_doc_text)

_target_: BTA
_logger: auto
_debug_mode: true
_template_manager:
  _target_: TemplateManager
  templates:
    - ${oc.env:PROMPT_TEMPLATES_DIR,prompt_templates}
    - ${modpath:agent_foundation.resources.prompt_templates}
  active_template_type: main
  predefined_variables: true
  cross_root_variable_lookup: true   # Refactor 17: framework wrappers + consumer specialized variants
  default_template_key: initial
  enable_templated_feed: true

name: project_onboarding_bta

workspace:
  _target_: InferencerWorkspace
  use_final_deliverables_folder: true

# --- Outer Breakdown ---
breakdown_inferencer:
  _target_: RovoDevCLI
  yolo: true
  debug_mode: true
  output_path: "breakdown_output.md"
  template_root_space: task_breakdown
  template_variables:
    task_preamble: project_onboarding

breakdown_format: json_subtasks
max_breakdown: 8
task_type_arg_name: task_preamble
promote_worker_deliverables: true
group_max_concurrency:
  skill_tool_creation: 2

# --- Outer Workers ---
# All subtasks are skill_tool_creation — reuses the inner BTA config from role_setup.
worker_factory:
  skill_tool_creation:
    _import_: "../role_setup/role_setup_skill_tool_creation.yaml"
  __default__: skill_tool_creation

# --- Outer Aggregator ---
aggregator_inferencer:
  _target_: RovoDevCLI
  yolo: true
  debug_mode: true
  template_root_space: implementation
  template_variables:
    task_instructions: project_onboarding_report

aggregator_prompt_builder:
  _target_: ConflictAwarePromptBuilder
  conflict_resolution_mode: delegate_to_aggregator

output_path: "project_onboarding_report.md"
conflict_resolution_mode: delegate_to_aggregator
debug_mode: true
