# Inner BTA config for skill/tool creation.
# Fully instantiatable via: instantiate(load_config(this_file))
#
# Usage:
#   import agent_foundation.common.configs.registered_targets
#   from python_utils.config_utils import load_config, instantiate
#   cfg = load_config("role_setup_skill_tool_creation.yaml", overrides={...})
#   bta = instantiate(cfg)

_target_: BTA

# =====================================================================
# Shared config (auto-injected into all children via _-prefix convention)
# =====================================================================
_logger: auto
_debug_mode: true
_template_manager:
  _target_: TemplateManager
  templates:
    - ${oc.env:PROMPT_TEMPLATES_DIR,prompt_templates}
    - ${modpath:agent_foundation.resources.prompt_templates}
  active_template_type: main
  predefined_variables: true
  cross_root_variable_lookup: true   # Refactor 17: framework wrappers + consumer specialized variants
  default_template_key: initial
  enable_templated_feed: true

# =====================================================================
# Workspace — configure directory layout here, not on the BTA itself.
# use_final_deliverables_folder: true → deliverables go to outputs/final_deliverables/
# root is set at runtime via load_config overrides: {"workspace.root": str(workspace_root)}
# =====================================================================
workspace:
  _target_: InferencerWorkspace
  use_final_deliverables_folder: true

# =====================================================================
# Pipeline: inferencers
# =====================================================================

# --- Breakdown ---
# template_root_space: task_breakdown defaulted by BTA.SLOT_DEFAULTS.
breakdown_inferencer:
  _target_: RovoDevCLI
  # opus-4-6 is the default model for RovoDevCLI (set in RovoDevCliInferencer).
  # opus correctly writes <Response> JSON to --output-file; sonnet writes to stdout only.
  output_path: "breakdown_output.md"   # → children/breakdown/outputs/breakdown_output.md
                                        # Triggers --output-file flag to acli;
                                        # task_breakdown/main/initial.jinja2 instructs
                                        # the agent to write its analysis there.
  template_variables:
    task_preamble: skill_tool_creation

# --- Workers (auto-partialed: each call creates a fresh instance) ---
worker_factory:
  skill_tool_creation_research:
    _target_: RovoChat
    auto_continue: true
    max_continuations: 5
    template_root_space: deep_research
    output_path: "facet.md"
    response_post_processor: extract_delimited
    template_variables:
      task_preamble: skill_tool_creation_research

  skill_tool_creation_investigation:
    _target_: RovoDevCLI
    template_root_space: deep_research
    output_path: "facet.md"
    response_post_processor: extract_delimited
    template_variables:
      task_preamble: skill_tool_creation_investigation

  __default__: skill_tool_creation_research

# --- Aggregator ---
# RovoDevCLI aggregator: has local file access, writes structured deliverables
# (skills/<name>/SKILL.md, tools/<name>/tool.json, tools/<name>/executor.py)
# directly to outputs/. output_is_deliverable moves them to outputs/final_deliverables/.
aggregator_inferencer:
  # task_preamble + task_response_format = aggregation defaulted by
  # BTA.SLOT_DEFAULTS; task_instructions: skill_tool_creation overrides
  # the default per-key (the skill-tool-specific instructions are what
  # tell the aggregator to write SKILL.md / tool.json / executor.py).
  _target_: RovoDevCLI
  output_is_deliverable: true
  output_path: "aggregation_report.md"
  template_root_space: implementation
  template_variables:
    task_instructions: skill_tool_creation

# =====================================================================
# Pipeline: settings
# =====================================================================
breakdown_format: json_subtasks
worker_query_fields:
  - description
  - todos
max_breakdown: 5
task_type_arg_name: task_preamble
expand_todos_to_workers: true
group_max_concurrency:
  skill_tool_creation_research: 3
  skill_tool_creation_investigation: 2
