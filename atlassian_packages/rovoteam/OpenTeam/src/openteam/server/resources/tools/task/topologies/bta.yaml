# BreakdownThenAggregate (BTA) — single ClaudeCodeCli per slot: 1 breakdown + N homogeneous workers + 1 aggregator.
# Template wiring (template_root_space=task_breakdown for breakdown,
# task_preamble/_instructions/_response_format=aggregation triplet for aggregator)
# is supplied by BTA.SLOT_DEFAULTS — only the use-case choice
# (template_root_space: implementation on the aggregator) is spelled out here.
_target_: BTA
breakdown_inferencer:
  _target_: ClaudeCodeCLI
  model_name: opus[1m]
  permission_mode: bypassPermissions
  idle_timeout_seconds: 300
worker_factory:
  __default__:
    _target_: ClaudeCodeCLI
    model_name: opus[1m]
    permission_mode: bypassPermissions
    idle_timeout_seconds: 300
aggregator_inferencer:
  _target_: ClaudeCodeCLI
  model_name: opus[1m]
  permission_mode: bypassPermissions
  idle_timeout_seconds: 300
  template_root_space: implementation
breakdown_format: json_subtasks
max_breakdown: 4
