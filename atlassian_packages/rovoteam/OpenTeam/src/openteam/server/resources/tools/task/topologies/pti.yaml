# PlanThenImplement (PTI) with Dual consensus per phase. The default topology — full RankEvolve quality.
_target_: agent_foundation.common.inferencers.agentic_inferencers.flow_inferencers.plan_then_implement_inferencer.PlanThenImplementInferencer
planner_inferencer:
  _target_: Dual
  base_inferencer:
    _target_: ClaudeCodeCLI
    model_name: opus[1m]
    permission_mode: bypassPermissions
    idle_timeout_seconds: 300
  review_inferencer:
    _target_: ClaudeCodeCLI
    model_name: opus[1m]
    permission_mode: bypassPermissions
    idle_timeout_seconds: 300
  consensus_config:
    _target_: ConsensusConfig
    max_iterations: 2
executor_inferencer:
  _target_: Dual
  base_inferencer:
    _target_: ClaudeCodeCLI
    model_name: opus[1m]
    permission_mode: bypassPermissions
    idle_timeout_seconds: 300
  review_inferencer:
    _target_: ClaudeCodeCLI
    model_name: opus[1m]
    permission_mode: bypassPermissions
    idle_timeout_seconds: 300
  consensus_config:
    _target_: ConsensusConfig
    max_iterations: 2
