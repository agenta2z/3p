# Outer BTA for role_setup: breakdown role_document → N inner BTAs → synthesis
#
# Usage:
#   import agent_foundation.common.configs.registered_targets
#   from python_utils.config_utils import load_config, instantiate
#   cfg = load_config("role_setup.yaml", overrides={"workspace.root": str(ws)})
#   bta = instantiate(cfg)
#   result = await bta.ainfer(role_doc_text)

_target_: BTA
_logger: auto
_debug_mode: true
_template_manager:
  _target_: TemplateManager
  templates:
    - ${oc.env:PROMPT_TEMPLATES_DIR,prompt_templates}
    - ${modpath:agent_foundation.resources.prompt_templates}
  active_template_type: main
  predefined_variables: true
  cross_root_variable_lookup: true   # Refactor 17: framework wrappers + consumer specialized variants
  default_template_key: initial
  enable_templated_feed: true

name: outer_bta

workspace:
  _target_: InferencerWorkspace
  use_final_deliverables_folder: true  # deliverables (skills, tools, association JSON) go to final_deliverables/; reports stay in outputs/

# --- Outer Breakdown ---
breakdown_inferencer:
  _target_: RovoDevCLI
  output_path: "breakdown_output.md"   # → children/breakdown/outputs/breakdown_output.md
                                        # Triggers --output-file flag to acli;
                                        # task_breakdown/main/initial.jinja2 instructs
                                        # the agent to write its analysis there.
  template_root_space: task_breakdown
  template_variables:
    task_preamble: role_setup

breakdown_format: json_subtasks
max_breakdown: 8
task_type_arg_name: task_preamble
promote_worker_deliverables: true
group_max_concurrency:
  skill_tool_creation: 2      # max 2 inner BTAs run concurrently
  skill_tool_association: 1   # only 1 association subtask ever exists

# --- Outer Workers ---
# Heterogeneous: creation subtasks get a full inner BTA, association gets a single RovoDevCLI.
# Dispatch via args.task_preamble from the outer breakdown JSON.
worker_factory:
  skill_tool_creation:
    _import_: "role_setup_skill_tool_creation.yaml"
    # workspace.use_final_deliverables_folder: true is set in role_setup_skill_tool_creation.yaml
  skill_tool_association:
    _target_: RovoDevCLI
    template_root_space: implementation
    template_variables:
      task_instructions: skill_tool_association
      task_preamble: ""
  __default__: skill_tool_creation

# --- Outer Aggregator ---
aggregator_inferencer:
  _target_: RovoDevCLI
  output_is_deliverable: true
  output_path: "role_setup_report.md"
  template_root_space: implementation
  template_variables:
    task_instructions: role_setup
